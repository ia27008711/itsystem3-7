<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>その取引、本当に大丈夫？</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <small>ONLINE TRADE SAFETY LAB</small>
      <h1>その取引、本当に大丈夫？</h1>
      <p>SNSでゲーム特典コードを買う前に、危険サインを見抜こう。</p>
    </div>
  </header>

  <main>
    <div class="notice">
      <strong>体験用サイトです。</strong>
      実際の送金・決済・アカウント登録は一切ありません。
      登場する人物・取引はすべて架空です。
    </div>

    <div class="progress">
      <span id="progress"></span>
    </div>

    <section id="intro" class="card">
      <h2>ミッション：限定特典コードを手に入れよう</h2>
      <p>
        SNSで、ゲーム内イベント限定コードが
        定価より安く出品されています。
        あなたならどう取引しますか？
      </p>

      <div class="split">
        <div>
          <h3>出品内容</h3>
          <p class="price">800円</p>
          <p>限定ゲーム特典コード 1点</p>
          <span class="tag">個人間取引</span>
          <span class="tag">電子決済を希望</span>
        </div>

        <div>
          <h3>今回のルール</h3>
          <ul>
            <li>本物のお金は使わない</li>
            <li>相手に質問してもよい</li>
            <li>途中で取引をやめてもよい</li>
          </ul>
        </div>
      </div>

      <button id="startButton" class="primary">
        取引を体験する
      </button>
    </section>

    <section id="scene" class="card hidden">
      <div class="profile">
        <div class="avatar">K</div>
        <div>
          <strong>kaito_game｜出品者</strong>
          <div class="muted small">
            フォロワー126人・アカウント作成時期は不明
          </div>
        </div>
      </div>

      <hr>

      <h2 id="sceneTitle"></h2>
      <div id="chat" class="chat"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="result hidden"></div>

      <div id="nextWrap" class="hidden">
        <button id="nextButton" class="primary">
          次の場面へ
        </button>
      </div>
    </section>

    <section id="ending" class="card hidden">
      <h2 id="endTitle"></h2>
      <div id="endBody"></div>

      <div class="result warn">
        <strong>覚えておきたいこと</strong>
        <ul>
          <li>商品を受け取る前の個人間送金にはリスクがあります。</li>
          <li>フォロワー数や取引実績の画像だけでは安全性を確認できません。</li>
          <li>公式ショップや購入者保護のある取引方法を優先しましょう。</li>
          <li>パスワードや認証コードは相手に渡さないでください。</li>
        </ul>
      </div>

      <p class="small muted">
        被害に遭った場合は、決済サービスへの連絡や証拠の保存を行い、
        消費者ホットライン188などに相談してください。
      </p>

      <button id="restartButton" class="primary">
        もう一度体験する
      </button>
    </section>

    <footer>
      学習用プロトタイプ｜実際の決済サービスとは接続していません
    </footer>
  </main>
</body>
</html>